[project]
name = "cv-updater"
version = "0.1.0"
description = "İş ilanına göre CV uyarlayan CLI aracı — dürüstlük guardrail'i ile."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15",
    "pydantic>=2.9",
    "anthropic>=0.69",
    "pypdf>=5.1",
    "rich>=13.9",
    "pyyaml>=6.0",
]

[project.scripts]
cv-updater = "cv_updater.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cv_updater"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
