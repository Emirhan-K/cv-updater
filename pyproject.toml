[project]
name = "cv-updater"
version = "0.1.0"
description = "İş ilanına göre CV uyarlayan CLI aracı — dürüstlük guardrail'i ile."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "typer>=0.15",
    "pydantic>=2.9",
    "anthropic>=0.69",
    "pypdf>=5.1",
    "rich>=13.9",
    "pyyaml>=6.0",
    "jsonschema>=4.26.0",
    "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
# ATS öz-kontrolünün (issue 10) yedek metin çıkarıcısı. Asıl motor `pypdf`;
# pdfplumber yalnızca pypdf boş ya da bozuk metin döndürdüğünde devreye giriyor,
# ve pdfminer.six + pillow'u sürüklediği için varsayılan kuruluma girmiyor.
pdf = ["pdfplumber>=0.11"]
render = [
    "rendercv[full]>=2.8",
]

[project.scripts]
cv-updater = "cv_updater.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    # Yedek motorun gerçekten çalıştığı test edilebilsin.
    "pdfplumber>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cv_updater"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
